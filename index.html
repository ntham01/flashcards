<style>
/* Layout: one quiet column. Type does the work: black = active, grey = everything else. One pill dock at the bottom. */
:root {
  --bg: #F4F4F1;
  --ink: #1B1B1A;
  --mid: #8C8C87;
  --faint: #C3C3BD;
  --rule: #E2E2DD;
  --accent: #E0533A;
  --on-ink: #F4F4F1;

}

    --card: #1C1C1A; --card-edge: #2C2C29; --hover: #1D1D1B; --title-rest: #6F6F6A; --bar: #2A2A27; --bar-pill: #F4F4F1; --bar-pill-ink: #1B1B1A; --bar-off: #6E6E69; --card-shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 22px 44px -22px rgba(0,0,0,.8); color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #111110; --ink: #ECECE7; --mid: #8A8A85; --faint: #4A4A46; --rule: #262624; --accent: #F06A50; --on-ink: #111110;
  --card: #1C1C1A; --card-edge: #2C2C29; --hover: #1D1D1B; --title-rest: #6F6F6A; --bar: #2A2A27; --bar-pill: #F4F4F1; --bar-pill-ink: #1B1B1A; --bar-off: #6E6E69; --card-shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 22px 44px -22px rgba(0,0,0,.8); color-scheme: dark; }

* { box-sizing: border-box; }

.shell { max-width: 640px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }

  .card-zone { margin-inline: -12px; padding-inline: 12px; }

}
header.top { padding-block: 14px 0; display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 58px; }
@media (max-width: 420px) { .ctrl .grade { font-size: 17px; } .ctrl { gap: 4px; } }
.date { font-size: 20px; line-height: 1.2; letter-spacing: -.01em; }

.sync { font-size: 13px; color: var(--mid); padding-top: 4px; white-space: nowrap; }
.sync { display: flex; gap: 14px; align-items: baseline; }
.sync .link { font-weight: 500; }
.sync[data-s="error"] #sync-text { color: var(--accent); }
.touch .hide-touch { display: none; }
main.shell { padding-block: 28px 72px; }
#app { display: flex; flex-direction: column; gap: 32px; }

/* type */
.huge { font: 700 clamp(96px, 26vw, 150px)/.82 var(--f); letter-spacing: -.06em; color: var(--faint); font-variant-numeric: tabular-nums; }
.title { font: 700 clamp(32px, 8vw, 44px)/1.05 var(--f); letter-spacing: -.035em; overflow-wrap: anywhere; }
.label { font-size: 13px; color: var(--mid); }
.small { font-size: 13px; color: var(--mid); }
.muted { color: var(--mid); }

/* links and buttons */
.link { font-weight: 600; color: var(--faint); transition: color .12s; }

.link.ink { color: var(--ink); }
.link.danger { color: var(--accent); }
.links { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 20px; letter-spacing: -.01em; }
.pill { display: inline-flex; align-items: center; justify-content: center; gap: 10px; background: var(--ink); color: var(--on-ink); border-radius: 999px; padding: 15px 30px; font-weight: 600; font-size: 16px; }
.pill:disabled { opacity: .3; cursor: default; }
.pill.wide { width: 100%; }
.pill.red { background: var(--accent); color: #fff; }
.tag { display: inline-block; font-size: 12px; line-height: 1; padding: 4px 9px; border: 1px solid var(--mid); border-radius: 999px; color: var(--ink); }

/* big lists (decks, menus) */
.menu { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.menu-row { width: 100%; display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
  font: 700 clamp(30px, 7.6vw, 42px)/1.1 var(--f); letter-spacing: -.035em; color: var(--ink); transition: color .12s; }
.menu-row span:first-child { min-width: 0; overflow-wrap: anywhere; }
.menu-row .n { font-size: 15px; font-weight: 500; letter-spacing: 0; color: var(--mid); font-variant-numeric: tabular-nums; flex: none; }
.menu-row.off { color: var(--faint); }
.menu-row.off:hover { color: var(--mid); }
.hero { display: flex; align-items: flex-end; gap: 18px; }
.hero .label { padding-bottom: 6px; line-height: 1.35; }

/* overview */
.stats3 { display: grid; grid-template-columns: repeat(3, auto); justify-content: start; gap: 4px 40px; margin: 0; }
.stats3 dd { margin: 0; font: 600 40px/1 var(--f); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.stats3 dt { font-size: 13px; color: var(--mid); grid-row: 2; }
.stats3 .zero { color: var(--faint); }

/* study */
.study { display: flex; flex-direction: column; gap: 28px; min-height: calc(100vh - 170px); }
.study-top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
.qcount { display: flex; gap: 14px; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--faint); }
.qcount .on { color: var(--ink); }
.progress { height: 3px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--ink); transition: width .25s; }
.qa { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 26px; padding-block: 24px; }
.q, .a { font: 600 clamp(26px, 6vw, 38px)/1.18 var(--f); letter-spacing: -.025em; overflow-wrap: anywhere; }
.qa.long .q, .qa.long .a { font-size: clamp(20px, 4.6vw, 26px); line-height: 1.3; letter-spacing: -.01em; }
.q.dim { color: var(--faint); }
.extra { font-size: 18px; color: var(--mid); }
.cloze-blank { color: var(--accent); }
.cloze-on { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 3px; text-underline-offset: 5px; }
.grades { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--rule); }
.grade { display: flex; flex-direction: column; gap: 2px; padding: 14px 0 4px; font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
.grade small { font-size: 13px; font-weight: 500; letter-spacing: 0; color: var(--mid); font-variant-numeric: tabular-nums; }
.grade[data-g="1"] { color: var(--accent); }
.grade:hover small { color: var(--ink); }
.study-foot { display: flex; justify-content: space-between; gap: 16px; font-size: 13px; }
.study-foot .link { font-weight: 500; }

/* forms */
.form { display: grid; gap: 26px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: 13px; color: var(--mid); }
.field input, .field select, .field textarea { width: 100%; border: 0; border-bottom: 1px solid var(--rule); border-radius: 0; background: transparent; padding: 6px 0 8px; font-size: 18px; }
.field textarea { font-size: 22px; font-weight: 500; letter-spacing: -.01em; line-height: 1.3; min-height: 2.6em; resize: vertical; field-sizing: content; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-bottom-color: var(--ink); }
.field textarea::placeholder, .field input::placeholder { color: var(--faint); }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 26px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 20px; letter-spacing: -.01em; }
.hint { font-size: 13px; color: var(--mid); }
.hint code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--ink); }
.form-end { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.recent { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 15px; color: var(--mid); }
.recent li { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* browse / plain lists */
.search { width: 100%; border: 0; border-bottom: 1px solid var(--rule); background: transparent; padding: 6px 0 10px; font: 600 26px/1.2 var(--f); letter-spacing: -.02em; border-radius: 0; }
.search:focus { outline: none; border-bottom-color: var(--ink); }
.search::placeholder { color: var(--faint); }
.filters { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: baseline; font-size: 15px; }
.plain-select { border: 0; background: transparent; font-weight: 600; color: var(--ink); padding: 0; }
.items { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.item { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding: 16px 0; border-bottom: 1px solid var(--rule); align-items: start; }
.item-t { font-size: 17px; font-weight: 500; line-height: 1.3; letter-spacing: -.01em; overflow-wrap: anywhere; }
.item-m { grid-column: 1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--mid); }
.item-d { grid-row: 1; grid-column: 2; font-size: 13px; color: var(--mid); text-align: right; font-variant-numeric: tabular-nums; }
.item.off .item-t { color: var(--faint); }

/* stats */
.kv { margin: 0; display: grid; grid-template-columns: 1fr auto; border-top: 1px solid var(--rule); }
.kv dt, .kv dd { padding: 12px 0; border-bottom: 1px solid var(--rule); margin: 0; }
.kv dt { display: flex; align-items: center; gap: 10px; }
.kv dt i { width: 8px; height: 8px; border-radius: 50%; background: var(--sw); }
.kv dd { font-variant-numeric: tabular-nums; font-weight: 600; }
.stack { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--rule); }
.stack i { height: 100%; }
.block { display: grid; gap: 14px; }
.block-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.block-head h2 { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
.bars { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 3px; height: 110px; align-items: end; border-bottom: 1px solid var(--ink); }
.bars i { display: block; background: var(--ink); border-radius: 2px 2px 0 0; }
.bars i.z { background: transparent; }
.bars i.now { background: var(--accent); }
.axis { display: flex; justify-content: space-between; font-size: 12px; color: var(--mid); font-variant-numeric: tabular-nums; }

/* dock */
.dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 10;
  display: flex; gap: 2px; padding: 5px; background: var(--ink); border-radius: 999px; max-width: calc(100vw - 32px); }
.dock button { color: var(--on-ink); font-size: 14px; font-weight: 600; padding: 11px 18px; border-radius: 999px; opacity: .7; white-space: nowrap; }
.dock button:hover { opacity: 1; }
.dock button[aria-current="page"] { background: var(--bg); color: var(--ink); opacity: 1; }
.dock[hidden] { display: none; }

/* sheet (modal) */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(17,17,16,.35); display: flex; align-items: flex-end; justify-content: center; overflow-y: auto;
  padding: max(40px, env(safe-area-inset-top, 0px)) max(0px, env(safe-area-inset-right, 0px)) 0 max(0px, env(safe-area-inset-left, 0px)); }
.sheet { width: 100%; max-width: 640px; background: var(--bg); border-radius: 22px 22px 0 0; display: grid; gap: 28px;
  padding: 26px max(24px, env(safe-area-inset-left, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 700px) { .scrim { align-items: center; padding-bottom: 40px; } .sheet { border-radius: 22px; } }
.sheet-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
.sheet-head h2 { font-size: 28px; font-weight: 700; letter-spacing: -.03em; }
.confirm { display: grid; gap: 14px; padding-top: 4px; }
.confirm p { font-size: 18px; font-weight: 600; letter-spacing: -.01em; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: var(--on-ink);
  padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 500; max-width: calc(100vw - 32px); }
/* arrows */
.home-btn { width: 44px; height: 44px; margin-left: -8px; display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; color: var(--ink); transition: background .15s, transform .15s; }
.home-btn:hover { opacity: .75; }
.home-btn:active { transform: scale(.94); }
.home-btn[hidden] { display: none; }
.arrow { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; color: var(--ink); flex: none; transition: background .12s, color .12s; }
.arrow:hover:not(:disabled) { background: var(--rule); }
.arrow:disabled { color: var(--faint); cursor: default; }
.back { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; color: var(--mid); margin-left: -2px; min-width: 0; }
.back span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.back svg { width: 20px; height: 20px; flex: none; }
.back:hover { color: var(--ink); }
.menu-row { align-items: center; }
.row-end { display: flex; align-items: center; gap: 10px; flex: none; }
.row-end svg { width: 22px; height: 22px; }
.menu-row.off .row-end svg { opacity: .7; }

/* cards */
.cardstack { position: relative; isolation: isolate; perspective: 1800px; margin-bottom: 22px; }
.cardstack::before, .cardstack::after { content: ""; position: absolute; inset: 0; background: var(--card); border: 1px solid var(--card-edge); border-radius: 24px; }
.cardstack::before { transform: translateY(11px) scale(.955); z-index: 0; }
.cardstack::after { transform: translateY(22px) scale(.91); z-index: -1; opacity: .7; }
.cardstack[data-depth="1"]::after, .cardstack[data-depth="0"]::after, .cardstack[data-depth="0"]::before { display: none; }
.card { position: relative; z-index: 1; background: var(--card); border: 1px solid var(--card-edge); border-radius: 24px; box-shadow: var(--card-shadow);
  min-height: clamp(300px, 50vh, 440px); display: grid; grid-template-rows: auto 1fr auto; gap: 12px; padding: 20px clamp(20px, 5vw, 32px); }
.card-meta { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--mid); }
.card-meta span:last-child { font-weight: 700; color: var(--ink); }
.card-body { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 18px; text-align: center; min-width: 0; }
.card-foot { display: flex; justify-content: flex-end; font-size: 12px; color: var(--faint); }
.card .title { text-align: center; }
.card .stats3 { justify-content: center; }
.card-zone { display: block; cursor: pointer; margin-inline: -20px; padding: 6px 20px 0; -webkit-tap-highlight-color: transparent; border-radius: 28px; }
.card-zone:focus-visible { outline-offset: -4px; }
@media (hover: hover) { .card-zone:hover .cardstack:not([style]) .card { border-color: var(--faint); } }
.flip { position: relative; z-index: 1; display: grid; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.3,.75,.2,1); }
.flip.flipped { transform: rotateY(180deg); }
.flip > .card { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.flip > .card.back { transform: rotateY(180deg); }
.card .q-small { font-size: 16px; font-weight: 500; letter-spacing: 0; color: var(--mid); }
.enter-r { animation: in-r .3s cubic-bezier(.3,.75,.2,1); }
.enter-l { animation: in-l .3s cubic-bezier(.3,.75,.2,1); }
@keyframes in-r { from { transform: translateX(36px) rotate(1.5deg); } to { transform: none; } }
@keyframes in-l { from { transform: translateX(-36px) rotate(-1.5deg); } to { transform: none; } }
.ctrl { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; gap: 10px; align-items: center; }
.ctrl .grades { border-top: 0; }
.ctrl .grade { padding-top: 6px; align-items: center; }
@media (prefers-reduced-motion: reduce) { .flip { transition: none; } .enter-r, .enter-l { animation: none; } }

/* home list: sits lower on the screen with room between decks */
.deck-block { margin-top: clamp(32px, 14vh, 150px); display: grid; gap: 28px; }
.hero-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
.plus-wrap { position: relative; flex: none; margin-bottom: 4px; }
.plus { width: 50px; height: 50px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--bar); color: var(--bar-pill);
  transition: transform .45s cubic-bezier(.34, 1.56, .64, 1), filter .2s ease, box-shadow .25s ease; }
.plus:hover { filter: brightness(1.25); transform: scale(1.07); box-shadow: 0 8px 20px -10px rgba(20,20,18,.5); }
.plus[aria-expanded="true"] { transform: rotate(45deg); }
.plus[aria-expanded="true"]:hover { transform: rotate(45deg) scale(1.07); }
.plus:active { transform: scale(.92); }
/* menus pop in from the button that opened them */
.pop { animation: pop-in .24s cubic-bezier(.3, .75, .2, 1); transform-origin: top left; }
.pop.pop-left { transform-origin: top right; }
.pop.pop-out { animation: pop-out .16s ease forwards; pointer-events: none; }
@keyframes pop-in { from { opacity: 0; transform: translateY(-6px) scale(.95); } }
@keyframes pop-out { to { opacity: 0; transform: translateY(-4px) scale(.97); } }
@media (prefers-reduced-motion: reduce) { .plus, .pop, .pop.pop-out { transition: none; animation: none; } }
.menu.deck-list { gap: 14px; }
.menu.deck-list .menu-row { padding-block: 4px; }
/* card faces */
.ct { font: 600 clamp(26px, 6vw, 38px)/1.18 var(--f); letter-spacing: -.025em; overflow-wrap: anywhere; margin: 0; }
.cs { font-size: 18px; line-height: 1.4; color: var(--mid); max-width: 34ch; overflow-wrap: anywhere; margin: 0; }
.card-body { gap: 12px; }
.ctrl { grid-template-columns: 56px minmax(0, 1fr) 56px; }
.ctrl-mid { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.ctrl-mid .pos { font-size: 15px; font-weight: 600; color: var(--ink); }
.ctrl-mid .restart { font-size: 13px; }
.study-top { align-items: center; }
/* arrows sit closer under the card, with more room around them */

let drag = null, suppressClick = false;

  drag.h = drag.li.getBoundingClientRect().height + 14;

  let to = 0;
  drag.mids.forEach((m, i) => { if (i !== drag.idx && center > m) to++; });
  drag.to = to;
  drag.lis.forEach((l, i) => {
    if (i === drag.idx) return;
    let s = 0;
    if (to > drag.idx && i > drag.idx && i <= to) s = -drag.h;
    if (to < drag.idx && i < drag.idx && i >= to) s = drag.h;

    const rows = parseLines($('#im-text').value);
    $('#im-preview').textContent = rows.length ? `${plural(rows.length, 'card')}. First: ${oneLine(rows[0].ft).slice(0, 50)} → ${oneLine(rows[0].bt).slice(0, 50)}` : 'Nothing to import yet.';
  };

  const sep = head.includes('\t') ? '\t' : head.includes(';') ? ';' : ',';

}

  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { const f = e.target.closest && e.target.closest('form'); if (f) { e.preventDefault(); f.requestSubmit(); } return; }
  if (typing) { if (e.key === 'Enter' && e.target.id === 'deck-title') { e.preventDefault(); e.target.blur(); } return; }
  if (e.ctrlKey || e.metaKey) return;
  if (e.altKey) { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); histMove(e.key === 'ArrowLeft' ? -1 : 1); } return; }
  if (view === 'overview') {
    if (e.target.tagName === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
    else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); }
    return;
  }
  if (view === 'decks') {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute && e.target.getAttribute('role') === 'button' && e.target.tagName !== 'BUTTON') { e.preventDefault(); e.target.click(); return; }
  }
});
if (window.matchMedia && matchMedia('(hover: none)').matches) document.documentElement.classList.add('touch');
try { if (location.hash) history.replaceState(null, '', location.pathname + location.search); } catch {}
resetHist('decks');
initStore();
